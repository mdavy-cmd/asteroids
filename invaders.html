<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Space Invaders</title>
    <style>
        html, body {
            height: 100%;
        }
        body {
            background-color: #000;
            color: #777;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            background-color: #000;
            width: min(100vw, calc((100vh - 40px) * 7 / 8));
            aspect-ratio: 7 / 8;
        }
        .instructions {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="224" height="256"></canvas>
    <div class="instructions">
        [LEFT / RIGHT] Move | [SPACE] Fire | [ENTER] Start | [M] Sound
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // The screen is the arcade's own 224x256 pixels, as seen on its upright (rotated) monitor:
    // x runs right from 0 to 223 and y runs down from 0 to 255. Timers are in frames at 60 per second.
    // Addresses like $1C00 point into the ROM disassembly at computerarcheology.com.
    const W = 224;
    const H = 256;
    const FRAME_MS = 1000 / 60;

    // Colour overlay: the cabinet's monitor sat behind strips of coloured film
    const OVERLAY_WHITE = 0xFFFFFFFF; // Colours as little-endian RGBA words for ImageData
    const OVERLAY_RED = 0xFF3030FF;
    const OVERLAY_GREEN = 0xFF30FF30;
    const OVERLAY_BLACK = 0xFF000000;

    // Rack: 5 rows of 11, row 0 at the bottom, on a 16-pixel grid. refX/refY is the top-left of
    // the bottom-left invader's cell, and every other invader is drawn relative to it.
    const RACK_ROWS = 5;
    const RACK_COLS = 11;
    const RACK_START_X = 24;
    const RACK_FIRST_Y = 128;   // Round 1 (NewGame $07EA)
    const RACK_START_Y = [152, 168, 176, 176, 176, 184, 184, 184]; // Rounds 2-9, then repeating (AlienStartTable $1DA3)
    const ROUND_END_FRAMES = 48;
    const RACK_STEP = 2;
    const RACK_DROP = 8;
    const RACK_RIGHT_EDGE = 213; // RackBump $1597 turns the rack when these screen columns light up
    const RACK_LEFT_EDGE = 9;

    // Cannon
    const PLAYER_Y = 216;
    const PLAYER_MIN_X = 16;
    const PLAYER_MAX_X = 185;
    const PLAYER_START_FRAMES = 128; // A new cannon appears after this long ($1B10)
    const ALIEN_FIRE_DELAY = 48;     // ...and the aliens hold their fire this much longer ($03B0)
    const PLAYER_EXPLOSION_CHANGES = 12; // The blown-up cannon flickers 11 times, 5 frames apart ($1B17)
    const PLAYER_EXPLOSION_STEP = 5;
    const INVADED_Y = 216;           // An invader reaching the cannon's row ends the game
    const START_SHIPS = 3;
    const EXTRA_SHIP_POINTS = 1500;

    // Alien shots ("bombs"). Each moves once every 3 frames, the three taking turns.
    const BOMB_ROLLING = 0;  // Aimed at the cannon (GameObj2 $0476)
    const BOMB_PLUNGER = 1;  // Columns from a table (GameObj3 $04B6)
    const BOMB_SQUIGGLY = 2; // Columns from a table (GameObj4 $0682)
    const BOMB_SPEED = 4;
    const BOMB_FAST_SPEED = 5;     // Once 8 or fewer invaders remain (SpeedShots $08D8)
    const BOMB_BOTTOM_Y = 228;     // Explodes on the line here
    const BOMB_PLAYER_TOP = 210;   // A collision with the bomb's top this low hits the cannon
    const BOMB_PLAYER_BOTTOM = 218;
    const BOMB_EXPLOSION_TICKS = 4; // The explosion shows for 3 moves
    const PLUNGER_COLUMNS = [1, 7, 1, 1, 1, 4, 11, 1, 6, 3, 1, 1, 11, 9, 2, 8]; // $1D00
    const SQUIGGLY_COLUMNS = [11, 1, 6, 3, 1, 1, 11, 9, 2, 8, 2, 11, 4, 7, 10]; // $1D06

    // Saucer. It takes the squiggly bomb's turn, so it moves once every 3 frames.
    const SAUCER_INTERVAL = 1536;   // Frames between saucers (TimeToSaucer $0913)
    const SAUCER_Y = 40;
    const SAUCER_SPEED = 2;
    const SAUCER_MIN_INVADERS = 8;
    const SAUCER_ZONE_Y = 42;       // A shot colliding at this height or above has hit the saucer
    const SAUCER_HIT_TICKS = 32;    // After a hit: explosion at 31, score at 24, cleared at 0
    // Points by shots fired this rack (SaucerScrTab $1D54). A ROM bug skips the table's 16th entry,
    // so it repeats every 15 shots and the 8th, 23rd, 38th... shot is worth 300.
    const SAUCER_SCORES = [100, 50, 50, 100, 150, 100, 100, 50, 300, 100, 100, 100, 50, 150, 100];
    // Bit 0 of ROM bytes $0800-$08FF, indexed by shots fired this rack: 1 = enter from the left
    const SAUCER_DIRECTION_BITS =
        "1010111010100011011111011100100100101111101000101110111110010111" +
        "0010001001111010011000010011000111101010011110111110010000010101" +
        "1000000101001111101001100101001110100000000010000001011111100010" +
        "1010101010111011010010110000100100010001010100110010111011101011";

    // The attract-mode demo's moves, one per shot: 1 = right, 2 = left (DemoCommands $1F74)
    const DEMO_COMMANDS = [1, 1, 0, 0, 1, 0, 2, 1, 0, 2];

    // Fleet march: frames between notes, by invaders left (FleetDelayExShip $1775, tables $1A11/$1A21)
    const FLEET_ALIENS = [50, 43, 36, 28, 22, 17, 13, 10, 8, 7, 6, 5, 4, 3, 2, 1];
    const FLEET_DELAYS = [52, 46, 39, 34, 28, 24, 21, 19, 16, 14, 13, 12, 11, 9, 7, 5];
    const FLEET_FIRST_NOTE = 64; // Frames into a rack ($1B96)

    // Player's shot (GameObj1 $03BB). Its sprite is an 8-row cell with the bottom 4 rows lit.
    const SHOT_START_Y = 208;
    const SHOT_SPEED = 4;
    const SHOT_TOP_Y = 32;    // Explodes on reaching this height (PlayerShotHit $14E4)
    const SHOT_EXPLOSION_FRAMES = 16;
    const INVADER_EXPLOSION_FRAMES = 16;
    const INVADER_POINTS = [10, 10, 20, 20, 30]; // By row, from the bottom ($1DA0)

    // Player shot states, numbered as in the ROM ($2025)
    const SHOT_IDLE = 0;
    const SHOT_STARTING = 1;
    const SHOT_MOVING = 2;
    const SHOT_EXPLODING = 3;    // Hit a shield or a bomb, or reached the top
    const SHOT_DONE = 4;         // Ready to be removed
    const SHOT_HIT_INVADER = 5;  // The invader it hit is exploding

    // Shields and the line under the cannon
    const SHIELD_X = [32, 77, 122, 167];
    const SHIELD_Y = 192;
    const LINE_Y = 239;

    // --- GRAPHICS ---
    // Transcribed from the ROM as hex, one byte per screen column from left to right, bit 7 at the top
    const SPRITE_DATA = {
        octopus0: "000039797A6EECFAFAEC6E7A79390000",        // $1C00, 10 points
        octopus1: "0000387A7F6DECFAFAEC6D7F7A380000",        // $1C30
        crab0: "000000781DBE6C3C3C3C6CBE1D780000",           // $1C10, 20 points
        crab1: "0000000E18BE6D3D3C3D6DBE180E0000",           // $1C40
        squid0: "00000000193A6DFAFA6D3A1900000000",          // $1C20, 30 points
        squid1: "000000001A3D68FCFC683D1A00000000",          // $1C50
        invaderExplosion: "00084922148142004281142249080000", // $1CC0
        player: "00000F1F1F1F1F7FFF7F1F1F1F1F0F00",          // $1C60
        playerExplosion0: "000401130307B30F2F032F4904030001", // $1C70
        playerExplosion1: "400805A30A035B0F27270B4B40841148", // $1C80
        playerShot: "0F",                                    // $1C90
        shotExplosion: "993C7E3DBC3E7C99",                   // $1C91
        rolling: "00FE00" + "24FE12" + "00FE00" + "48FE90",  // $1CEE, four frames of three columns
        plunger: "04FC04" + "10FC10" + "20FC20" + "80FC80",  // $1CE2
        squiggly: "44AA10" + "885422" + "10AA44" + "225488", // $1CD0
        bombExplosion: "4A15BE3F5E25",                       // $1CDC
        saucer: "00000000040C1E373E7C747E7E747C3E371E0C0400000000",          // $1D64
        saucerExplosion: "002200A54008983DB63C361D104862B61D98084290080000", // $1D7C
        // $1D20: two bytes per column, the lower 8 pixels first
        shield: "FF0FFF1FFF3FFF7FFFFFFCFFF8FFF0FFF0FFF0FFF0FFF0FFF0FFF0FFF8FFFCFFFFFFFFFFFF7FFF3FFF1FFF0F"
    };

    // The character set at $1E00, 8 bytes per character
    const FONT_DATA = {
        "A": "001F2444241F0000", "B": "007F494949360000", "C": "003E414141220000", "D": "007F4141413E0000",
        "E": "007F494949410000", "F": "007F484848400000", "G": "003E414145470000", "H": "007F0808087F0000",
        "I": "0000417F41000000", "J": "00020101017E0000", "K": "007F081422410000", "L": "007F010101010000",
        "M": "007F2018207F0000", "N": "007F1008047F0000", "O": "003E4141413E0000", "P": "007F484848300000",
        "Q": "003E4145423D0000", "R": "007F484C4A310000", "S": "0032494949260000", "T": "0040407F40400000",
        "U": "007E0101017E0000", "V": "007C0201027C0000", "W": "007F020C027F0000", "X": "0063140814630000",
        "Y": "0060100F10600000", "Z": "0043454951610000", "0": "003E4549513E0000", "1": "0000217F01000000",
        "2": "0023454949310000", "3": "0042414959660000", "4": "000C14247F040000", "5": "00725151514E0000",
        "6": "001E294949460000", "7": "0040474850600000", "8": "0036494949360000", "9": "003149494A3C0000",
        "<": "0008142241000000", ">": "0000412214080000", " ": "0000000000000000", "=": "0014141414140000",
        "*": "0022147F14220000", "?": "0020404D50200000", "-": "0008080808080000"
    };

    // A sprite is a list of column bit patterns, with bit (h - 1) at the top
    function sprite(hex, height = 8) {
        const bytes = hex.match(/../g).map(b => parseInt(b, 16));
        const cols = [];
        for (let i = 0; i < bytes.length; i += height / 8) {
            cols.push(height === 16 ? bytes[i + 1] << 8 | bytes[i] : bytes[i]);
        }
        return { w: cols.length, h: height, cols: cols };
    }

    // Splits a strip of equal-width animation frames
    function frames(hex, count) {
        const len = hex.length / count;
        return Array.from({ length: count }, (_, i) => sprite(hex.substr(i * len, len)));
    }

    const D = SPRITE_DATA;
    const SPR = {
        invaders: [
            [sprite(D.octopus0), sprite(D.octopus1)],
            [sprite(D.crab0), sprite(D.crab1)],
            [sprite(D.squid0), sprite(D.squid1)]
        ],
        invaderExplosion: sprite(D.invaderExplosion),
        player: sprite(D.player),
        playerExplosion: [sprite(D.playerExplosion0), sprite(D.playerExplosion1)],
        playerShot: sprite(D.playerShot),
        shotExplosion: sprite(D.shotExplosion),
        bombs: [frames(D.rolling, 4), frames(D.plunger, 4), frames(D.squiggly, 4)],
        bombExplosion: sprite(D.bombExplosion),
        saucer: sprite(D.saucer),
        saucerIcon: sprite(D.saucer.substr(8, 32)), // The score table shows its middle 16 columns ($1D68)
        saucerExplosion: sprite(D.saucerExplosion),
        shield: sprite(D.shield, 16)
    };
    const FONT = {};
    for (const ch in FONT_DATA) FONT[ch] = sprite(FONT_DATA[ch]);

    // --- GAME STATE ---
    let mode = "attract"; // attract | playing | gameover
    let tasksOn = false;  // Whether the invaders, cannon and shots are running (in a game or the demo)
    let script = null;    // The sequence driving the screens around the game (see ATTRACT MODE)
    let frame = 0;
    let rackCount = 0;    // Racks cleared, which sets how low the next one starts
    let roundEndTimer = 0;
    let demoCmd = 0;      // Position in DEMO_COMMANDS, carried from one demo to the next
    let demoMove = 1;
    let score = 0;
    let highScore = loadHighScore();
    let ships = 0;
    let extraShipAvailable = false;

    let alive = new Uint8Array(RACK_ROWS * RACK_COLS); // Index = row * 11 + column
    let numAliens = 0;
    let refX = RACK_START_X;
    let refY = RACK_FIRST_Y;
    let rackDX = RACK_STEP;
    let rackDY = 0;
    let rackRight = true;
    let animFrame = 0;
    let cursor = 0;         // The invader due to be redrawn next
    let waitOnDraw = false; // The cursor waits until that invader has been drawn

    let player = null;
    let playerOK = false;   // False while the cannon is blowing up or waiting to reappear
    let enableAlienFire = false;
    let alienFireDelay = 0;

    let invadedFlag = false;

    let shot = null;
    let fireBounce = false; // Fire must be let go between shots
    let shotCount = 0;      // Shots fired this rack
    let invaderExplosion = { timer: 0, x: 0, y: 0 };

    let bombs = [];
    let bombSpeed = BOMB_SPEED;
    let skipPlunger = false; // Plunger bombs stop once only one invader is left

    let saucer = null;
    let tillSaucer = SAUCER_INTERVAL;

    let fleetCount = FLEET_FIRST_NOTE; // Frames until the next note of the march
    let fleetNote = 1;

    // --- CONTROLS ---
    const keys = {};    // Keys held down
    const pressed = {}; // Keys pressed since the last frame

    document.addEventListener("keydown", (e) => {
        if (["Space", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
        keys[e.code] = true;
        if (!e.repeat) pressed[e.code] = true;
        sound.unlock();
        if (e.code === "KeyM" && !e.repeat) sound.toggleMute();
    });
    document.addEventListener("keyup", (e) => { keys[e.code] = false; });
    window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
    document.addEventListener("visibilitychange", () => sound.pause(document.hidden));

    // --- SOUND ---
    // The cabinet made its sounds with analogue circuits; these are synthesized imitations.
    // Nothing plays until the first key press (browser autoplay rules).
    const sound = {
        ctx: null,
        master: null,
        noiseBuffer: null,
        muted: false,
        saucerOn: false,
        saucerNodes: null,

        unlock() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                this.ctx = new AudioCtx();
                this.master = this.ctx.createGain();
                this.master.gain.value = this.muted ? 0 : 0.5;
                this.master.connect(this.ctx.destination);
                // One second of white noise for the explosions
                const rate = this.ctx.sampleRate;
                this.noiseBuffer = this.ctx.createBuffer(1, rate, rate);
                const data = this.noiseBuffer.getChannelData(0);
                for (let i = 0; i < rate; i++) data[i] = Math.random() * 2 - 1;
            }
            if (this.ctx.state === "suspended" && !document.hidden) this.ctx.resume();
        },

        pause(hidden) {
            if (!this.ctx) return;
            if (hidden) this.ctx.suspend();
            else this.ctx.resume();
        },

        toggleMute() {
            this.muted = !this.muted;
            if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
        },

        tone(type, from, to, duration, volume, delay = 0) {
            if (!this.ctx) return;
            const t = this.ctx.currentTime + delay;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(from, t);
            osc.frequency.exponentialRampToValueAtTime(to, t + duration);
            gain.gain.setValueAtTime(volume, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
            osc.connect(gain).connect(this.master);
            osc.start(t);
            osc.stop(t + duration);
        },

        noise(duration, volume, cutoff) {
            if (!this.ctx) return;
            const t = this.ctx.currentTime;
            const src = this.ctx.createBufferSource();
            const filter = this.ctx.createBiquadFilter();
            const gain = this.ctx.createGain();
            src.buffer = this.noiseBuffer;
            src.loop = true;
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(cutoff, t);
            filter.frequency.exponentialRampToValueAtTime(cutoff / 4, t + duration);
            gain.gain.setValueAtTime(volume, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
            src.connect(filter).connect(gain).connect(this.master);
            src.start(t, Math.random() * 0.5);
            src.stop(t + duration);
        },

        // A square wave wobbled up and down by a slower one; with no duration it runs until stopped
        warble(freq, rate, depth, volume, duration = 0) {
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const lfo = this.ctx.createOscillator();
            const amount = this.ctx.createGain();
            const gain = this.ctx.createGain();
            osc.type = "square";
            osc.frequency.value = freq;
            lfo.type = "triangle";
            lfo.frequency.value = rate;
            amount.gain.value = depth;
            gain.gain.setValueAtTime(volume, t);
            lfo.connect(amount).connect(osc.frequency);
            osc.connect(gain).connect(this.master);
            osc.start(t);
            lfo.start(t);
            if (duration) {
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.stop(t + duration);
                lfo.stop(t + duration);
            }
            return [osc, lfo];
        },

        // The march's four descending bass notes
        fleet(note) {
            const f = [98, 87, 78, 73][note];
            this.tone("square", f, f * 0.94, 0.12, 0.28);
        },
        shot() {
            this.tone("sawtooth", 1250, 250, 0.22, 0.06);
            this.noise(0.1, 0.1, 4000);
        },
        invaderHit() { this.tone("square", 1000, 120, 0.27, 0.1); },
        playerDeath() { this.noise(1, 0.8, 1400); },
        saucerHit() {
            if (this.ctx) this.warble(520, 10, 180, 0.08, 1.5);
        },
        extraShip() {
            for (let i = 0; i < 8; i++) this.tone("square", 1350, 1300, 0.06, 0.07, i * 0.12);
        },

        // The saucer's siren, for as long as it flies
        setSaucer(on) {
            if (!this.ctx || on === this.saucerOn) return;
            this.saucerOn = on;
            if (this.saucerNodes) {
                this.saucerNodes.forEach(node => node.stop());
                this.saucerNodes = null;
            }
            if (on) this.saucerNodes = this.warble(330, 6, 110, 0.05);
        }
    };

    // Sound only plays during a game; attract mode and its demo are silent, as in the arcade
    function sfx(name, arg) {
        if (mode === "playing") sound[name](arg);
    }

    // --- HELPERS ---
    function loadHighScore() {
        try {
            return Number(localStorage.getItem("invadersHighScore")) || 0;
        } catch (e) {
            return 0;
        }
    }

    function saveHighScore() {
        try {
            localStorage.setItem("invadersHighScore", highScore);
        } catch (e) {
            // Storage unavailable (e.g. private browsing); the high score just won't persist
        }
    }

    // --- SCREEN ---
    // Like the arcade's video memory, the screen is never wiped: each object erases its old image
    // and draws its new one, and anything drawn onto lit pixels has hit something.
    const screen = new Uint8Array(W * H);

    // Visits each lit pixel of a sprite that lands on screen
    function eachPixel(spr, x, y, fn) {
        for (let i = 0; i < spr.w; i++) {
            const px = x + i;
            if (px < 0 || px >= W) continue;
            for (let r = 0; r < spr.h; r++) {
                const py = y + r;
                if (py >= 0 && py < H && spr.cols[i] & 1 << (spr.h - 1 - r)) fn(py * W + px);
            }
        }
    }

    // ORs a sprite onto the screen and reports whether it touched anything already there
    function drawSprite(spr, x, y) {
        let hit = false;
        eachPixel(spr, x, y, k => {
            if (screen[k]) hit = true;
            screen[k] = 1;
        });
        return hit;
    }

    // Clears the sprite's lit pixels, whatever they belong to now
    function eraseSprite(spr, x, y) {
        eachPixel(spr, x, y, k => { screen[k] = 0; });
    }

    // Overwrites the sprite's whole block, blank pixels included
    function writeSprite(spr, x, y) {
        clearRect(x, y, spr.w, spr.h);
        drawSprite(spr, x, y);
    }

    function clearRect(x, y, w, h) {
        for (let py = Math.max(y, 0); py < Math.min(y + h, H); py++) {
            screen.fill(0, py * W + Math.max(x, 0), py * W + Math.min(x + w, W));
        }
    }

    function isLit(x, y) {
        return screen[y * W + x] === 1;
    }

    // Text sits in 8x8 character cells
    function drawText(str, x, y) {
        for (const ch of str) {
            writeSprite(FONT[ch] || FONT[" "], x, y);
            x += 8;
        }
    }

    // --- HUD ---
    function formatScore(n) {
        return String(n).padStart(4, "0");
    }

    function drawScores() {
        drawText(formatScore(score), 24, 24);
        drawText(formatScore(highScore), 88, 24);
    }

    // The digit counts the cannon in play; the icons show the ones in reserve
    function drawShips() {
        drawText(String(ships), 8, 240);
        clearRect(24, 240, 112, 8);
        for (let i = 0; i < ships - 1; i++) writeSprite(SPR.player, 24 + i * 16, 240);
    }

    function drawHud() {
        drawText(" SCORE<1> HI-SCORE SCORE<2> ", 0, 8);
        drawScores();
        drawText("CREDIT 00", 136, 240);
        drawShips();
    }

    // --- GAME FLOW ---
    function startGame() {
        mode = "playing";
        tasksOn = false;
        score = 0;
        ships = START_SHIPS;
        extraShipAvailable = true;
        invadedFlag = false;
        rackCount = 0;
        roundEndTimer = 0;
        drawHud();
        script = startScript();
    }

    // The game stops where it is while "GAME OVER" is typed over it
    function gameOver() {
        mode = "gameover";
        tasksOn = false;
        ships = 0;
        drawShips();
        if (score > highScore) {
            highScore = score;
            saveHighScore();
            drawScores();
        }
        script = gameOverScript();
    }

    // After the last invader falls (and any cannon explosion ends), a short pause, then the next rack
    function endOfRound() {
        if (player.hit) {
            roundEndTimer = 0;
            return;
        }
        if (++roundEndTimer < ROUND_END_FRAMES) return;
        roundEndTimer = 0;
        nextRack();
    }

    function nextRack() {
        rackCount = (rackCount & 7) + 1;
        newRack(RACK_START_Y[rackCount - 1]);
    }

    function clearPlayfield() {
        clearRect(0, 32, W, 208);
    }

    // Four digits that wrap past 9,999, as in the arcade
    function addScore(points) {
        if (mode !== "playing") return;
        score = (score + points) % 10000;
        drawScores();
    }

    function checkExtraShip() {
        if (!extraShipAvailable || score < EXTRA_SHIP_POINTS) return;
        extraShipAvailable = false;
        ships++;
        drawShips();
        sfx("extraShip");
    }

    // Everything the arcade resets from its ROM copy at the start of a rack
    function newRack(startY) {
        clearPlayfield();
        alive.fill(1);
        numAliens = alive.length;
        refX = RACK_START_X;
        refY = startY;
        rackDX = RACK_STEP;
        rackDY = 0;
        rackRight = true;
        animFrame = 0;
        cursor = 0;
        waitOnDraw = true;
        resetPlayer();
        playerOK = true;
        enableAlienFire = false;
        alienFireDelay = ALIEN_FIRE_DELAY;
        resetShot();
        fireBounce = false;
        shotCount = 0;
        invaderExplosion.timer = 0;
        bombs = [BOMB_ROLLING, BOMB_PLUNGER, BOMB_SQUIGGLY].map(type => newBomb(type, 0));
        bombSpeed = BOMB_SPEED;
        skipPlunger = false;
        resetSaucer();
        tillSaucer = SAUCER_INTERVAL;
        fleetCount = FLEET_FIRST_NOTE;
        fleetNote = 1; // The ROM moves the march on once before its first note
        demoMove = 1;
        drawShields();
        drawBottomLine();
    }

    function drawShields() {
        for (const x of SHIELD_X) writeSprite(SPR.shield, x, SHIELD_Y);
    }

    function drawBottomLine() {
        screen.fill(1, LINE_Y * W, LINE_Y * W + W);
    }

    // --- PLAYER ---
    function resetPlayer() {
        player = {
            x: PLAYER_MIN_X,
            timer: PLAYER_START_FRAMES, // Frames until the cannon appears
            hit: false,
            blowDelay: PLAYER_EXPLOSION_STEP,
            blowChanges: PLAYER_EXPLOSION_CHANGES,
            blowFrame: 0
        };
    }

    // GameObj0 $028E
    function updatePlayer() {
        if (player.timer > 0) {
            player.timer--;
            return;
        }
        if (player.hit) {
            blowUpPlayer();
            return;
        }
        playerOK = true;
        if (!enableAlienFire && --alienFireDelay === 0) enableAlienFire = true;

        // Right wins if both are held, as in the arcade. The demo follows its own script.
        const demo = mode === "attract";
        if (demo ? demoMove & 1 : keys["ArrowRight"] || keys["KeyD"]) {
            if (player.x < PLAYER_MAX_X) player.x++;
        } else if (demo ? demoMove & 2 : keys["ArrowLeft"] || keys["KeyA"]) {
            if (player.x > PLAYER_MIN_X) player.x--;
        }
        writeSprite(SPR.player, player.x, PLAYER_Y);
    }

    function hitPlayer() {
        if (!player.hit) sfx("playerDeath");
        player.hit = true;
        player.blowFrame = 0;
    }

    // The intact cannon stays for 5 frames, then the two explosion pictures alternate. From the
    // first change the invaders stop and hold their fire.
    function blowUpPlayer() {
        if (--player.blowDelay > 0) return;
        playerOK = false;
        enableAlienFire = false;
        alienFireDelay = ALIEN_FIRE_DELAY;
        player.blowDelay = PLAYER_EXPLOSION_STEP;
        if (--player.blowChanges > 0) {
            player.blowFrame ^= 1;
            writeSprite(SPR.playerExplosion[player.blowFrame], player.x, PLAYER_Y);
            return;
        }

        clearRect(player.x, PLAYER_Y, 16, 8);
        resetPlayer();
        if (mode !== "playing") return; // The demo just ends
        if (invadedFlag || ships === 1) {
            gameOver();
        } else {
            ships--;
            drawShips();
        }
    }

    // The game is over as soon as the cannon finishes exploding, whatever is left in reserve
    function invaded() {
        if (invadedFlag) return;
        invadedFlag = true;
        hitPlayer();
    }

    // --- PLAYER SHOT ---
    function resetShot() {
        shot = {
            status: SHOT_IDLE,
            x: 0,
            y: SHOT_START_Y,
            sprite: SPR.playerShot,
            timer: SHOT_EXPLOSION_FRAMES,
            collided: false
        };
    }

    // PlrFireOrDemo $1618. The button is only checked while no shot is on screen, so it has to be
    // let go (and seen to be let go) between shots.
    function playerFire() {
        if (player.hit || player.timer > 0 || shot.status !== SHOT_IDLE) return;
        if (mode === "attract") {
            // The demo fires constantly, taking its next move with each shot
            shot.status = SHOT_STARTING;
            demoCmd = (demoCmd + 1) % DEMO_COMMANDS.length;
            demoMove = DEMO_COMMANDS[demoCmd];
            return;
        }
        const down = keys["Space"] || pressed["Space"];
        if (fireBounce) {
            if (!down) fireBounce = false;
        } else if (down) {
            shot.status = SHOT_STARTING;
            fireBounce = true;
            sfx("shot");
        }
    }

    // GameObj1 $03BB
    function updatePlayerShot() {
        switch (shot.status) {
            case SHOT_STARTING:
                shot.status = SHOT_MOVING;
                shot.x = player.x + 8;
                drawSprite(shot.sprite, shot.x, shot.y);
                break;
            case SHOT_MOVING:
                eraseSprite(shot.sprite, shot.x, shot.y);
                shot.y -= SHOT_SPEED;
                shot.collided = drawSprite(shot.sprite, shot.x, shot.y);
                break;
            case SHOT_EXPLODING:
                // The explosion replaces the shot, and erasing it later bites out whatever it covered
                if (--shot.timer === 0) {
                    endOfShot();
                } else if (shot.timer === SHOT_EXPLOSION_FRAMES - 1) {
                    eraseSprite(shot.sprite, shot.x, shot.y);
                    shot.sprite = SPR.shotExplosion;
                    shot.x -= 3;
                    shot.y += 2;
                    drawSprite(shot.sprite, shot.x, shot.y);
                }
                break;
            case SHOT_DONE:
                endOfShot();
                break;
        }
    }

    // EndOfBlowup $0436. Each shot fired also picks the side the next saucer will come from.
    function endOfShot() {
        eraseSprite(shot.sprite, shot.x, shot.y);
        resetShot();
        shotCount++;
        if (saucer.active) return;
        const fromLeft = SAUCER_DIRECTION_BITS[shotCount % 256] === "1";
        saucer.x = fromLeft ? 9 : 192;
        saucer.dx = fromLeft ? SAUCER_SPEED : -SAUCER_SPEED;
    }

    // PlayerShotHit $14D8: work out what the shot ran into from where it was
    function playerShotHit() {
        if (shot.status !== SHOT_MOVING) return;
        if (shot.y <= SHOT_TOP_Y) {
            shot.status = SHOT_EXPLODING;
            return;
        }
        if (!shot.collided) return;
        shot.collided = false;

        if (shot.y <= SAUCER_ZONE_Y) {
            saucer.hit = true;
            shot.status = SHOT_DONE;
            return;
        }
        // Below the rack it must be a shield or a bomb, unless the rack's bottom-left corner has
        // dropped off the screen (with its top rows down in the shields)
        if (refY <= 248 && shot.y >= refY + 6) {
            shot.status = SHOT_EXPLODING;
            return;
        }
        // Otherwise find the rack cell where it hit. Column 11 runs on into the next row up, as in the ROM.
        const row = Math.ceil((refY - shot.y + 6) / 16) - 1;
        const col = findColumn(shot.x) - 1;
        const index = row * RACK_COLS + col;
        if (index >= alive.length || !alive[index]) {
            shot.status = SHOT_EXPLODING; // No invader there, so it hit a bomb
            return;
        }
        alive[index] = 0;
        addScore(INVADER_POINTS[row]);
        sfx("invaderHit");
        invaderExplosion = { timer: INVADER_EXPLOSION_FRAMES, x: refX + col * 16, y: refY - row * 16 };
        writeInvader(SPR.invaderExplosion, invaderExplosion.x, invaderExplosion.y);
        shot.status = SHOT_HIT_INVADER;
    }

    // --- INVADERS ---
    // The rack ripples: only one invader is redrawn per frame, so a full rack takes 55 frames to
    // move one step and the last invader moves every frame.
    function invaderX(index) {
        return refX + (index % RACK_COLS) * 16;
    }

    function invaderY(index) {
        return refY - Math.floor(index / RACK_COLS) * 16;
    }

    // Invaders overwrite a 16x16 block, their own 8 rows plus the 8 above, which wipes out their
    // old image when the rack drops (and anything else in the way, like shields)
    function writeInvader(spr, x, y) {
        clearRect(x, y - 8, 16, 8);
        writeSprite(spr, x, y);
    }

    // DrawAlien $0100. While a hit invader explodes, the rack stands still.
    function drawInvader() {
        if (invaderExplosion.timer > 0) {
            if (--invaderExplosion.timer === 0) {
                clearRect(invaderExplosion.x, invaderExplosion.y - 8, 16, 16);
                shot.status = SHOT_DONE;
            }
            return;
        }
        if (!waitOnDraw) return;
        if (alive[cursor]) {
            const type = Math.floor(cursor / RACK_COLS) >> 1; // Octopus, crab, crab... from the bottom row up
            writeInvader(SPR.invaders[type][animFrame], invaderX(cursor), invaderY(cursor));
        }
        waitOnDraw = false;
    }

    // CursorNextAlien $0141: move on to the next live invader, stepping the rack after the last one
    function advanceCursor() {
        if (!playerOK || waitOnDraw || !alive.includes(1)) return;
        do {
            if (++cursor === alive.length) {
                moveRack();
                cursor = 0;
            }
        } while (!alive[cursor]);
        if (invaderY(cursor) >= INVADED_Y) {
            invaded();
            return;
        }
        waitOnDraw = true;
    }

    // The rack column (from 1) over screen column x. As in the ROM's FindColumn, anything left of
    // the rack counts as column 1.
    function findColumn(x) {
        return x > refX ? Math.ceil((x - refX) / 16) : 1;
    }

    function lowestInColumn(col) {
        for (let index = col - 1; index < alive.length; index += RACK_COLS) {
            if (alive[index]) return index;
        }
        return -1;
    }

    // MoveRefAlien $01A1
    function moveRack() {
        refX += rackDX;
        refY += rackDY;
        rackDY = 0;
        animFrame ^= 1;
    }

    // RackBump $1597: any lit pixel at the edge turns the rack, starting from its next step.
    // A lone invader steps right by 3 instead of 2.
    function rackBump() {
        if (rackRight) {
            if (!columnLit(RACK_RIGHT_EDGE)) return;
            rackDX = -RACK_STEP;
        } else {
            if (!columnLit(RACK_LEFT_EDGE)) return;
            rackDX = numAliens === 1 ? RACK_STEP + 1 : RACK_STEP;
        }
        rackRight = !rackRight;
        rackDY = RACK_DROP;
    }

    function columnLit(x) {
        for (let y = 40; y <= 223; y++) {
            if (isLit(x, y)) return true;
        }
        return false;
    }

    function countInvaders() {
        numAliens = alive.reduce((n, a) => n + a, 0);
        if (numAliens <= 8) bombSpeed = BOMB_FAST_SPEED;
    }

    // TimeFleetSound $1740: the march quickens as the rack thins. It keeps its own time rather
    // than following the rack's steps, and stops while the cannon is down.
    function timeFleetSound() {
        if (!playerOK || numAliens === 0) return;
        if (--fleetCount > 0) return;
        fleetCount = fleetDelay(numAliens);
        sfx("fleet", fleetNote);
        fleetNote = (fleetNote + 1) % 4;
    }

    function fleetDelay(invaders) {
        return FLEET_DELAYS[FLEET_ALIENS.findIndex(n => invaders >= n)];
    }

    // --- ALIEN SHOTS ---
    function newBomb(type, colPtr) {
        return {
            type: type,
            active: false,
            blowing: false,
            blowCnt: BOMB_EXPLOSION_TICKS,
            steps: 0,      // Moves made, which sets when the other bombs may fire
            x: 0,
            y: 0,
            frameIdx: 0,
            sprite: SPR.bombs[type][0],
            colPtr: colPtr, // Position in the column table, kept from bomb to bomb
            skipFirst: type === BOMB_ROLLING // The rolling bomb sits out its first turn after each reset
        };
    }

    // AShotReloadRate $170E: a new bomb waits until the others have made this many moves
    function reloadRate(points) {
        const hundreds = Math.floor(points / 100);
        if (hundreds <= 2) return 48;
        if (hundreds <= 10) return 16;
        if (hundreds <= 20) return 11;
        if (hundreds <= 30) return 8;
        return 7;
    }

    // One bomb gets a turn each frame: rolling, plunger, then squiggly. A saucer that's due takes
    // the squiggly's turn once that bomb is out of the way.
    function updateBombs() {
        const turn = frame % 3;
        if (turn === BOMB_PLUNGER && skipPlunger) return;
        if (turn === BOMB_SQUIGGLY && saucer.start && bombs[BOMB_SQUIGGLY].steps === 0 &&
            (saucer.active || numAliens >= SAUCER_MIN_INVADERS)) {
            updateSaucer();
            return;
        }
        const b = bombs[turn];
        if (b.skipFirst) {
            b.skipFirst = false;
            return;
        }
        handleBomb(b, bombs.filter(o => o !== b));
        if (b.blowCnt > 0) return;
        // The explosion is over: the bomb is ready to fire again
        bombs[turn] = newBomb(b.type, b.colPtr);
        if (b.type === BOMB_PLUNGER && numAliens === 1) skipPlunger = true;
    }

    // HandleAlienShot $0563
    function handleBomb(b, others) {
        if (!b.active) {
            if (!enableAlienFire) return;
            b.steps = 0;
            const rate = reloadRate(score);
            if (others.some(o => o.steps !== 0 && o.steps <= rate)) return;

            let col;
            if (b.type === BOMB_ROLLING) {
                col = Math.min(findColumn(player.x + 8), RACK_COLS);
            } else {
                const table = b.type === BOMB_PLUNGER ? PLUNGER_COLUMNS : SQUIGGLY_COLUMNS;
                col = table[b.colPtr];
                b.colPtr = (b.colPtr + 1) % table.length;
            }
            // The lowest invader in the column fires, from just below itself
            const index = lowestInColumn(col);
            if (index < 0) return;
            b.x = invaderX(index) + 7;
            b.y = invaderY(index) + 10;
            b.active = true;
            b.steps = 1;
            return;
        }

        if (b.blowing) {
            explodeBomb(b);
            return;
        }
        b.steps++;
        eraseSprite(b.sprite, b.x, b.y);
        b.frameIdx = (b.frameIdx + 1) % 4;
        b.sprite = SPR.bombs[b.type][b.frameIdx];
        b.y += bombSpeed;
        const collided = drawSprite(b.sprite, b.x, b.y);
        if (b.y >= BOMB_BOTTOM_Y) {
            b.blowing = true;
        } else if (collided) {
            if (b.y >= BOMB_PLAYER_TOP && b.y <= BOMB_PLAYER_BOTTOM) hitPlayer();
            b.blowing = true;
        }
    }

    // ShotBlowingUp $0644: the explosion replaces the bomb, then erasing it bites out what it covered
    function explodeBomb(b) {
        b.blowCnt--;
        if (b.blowCnt === BOMB_EXPLOSION_TICKS - 1) {
            eraseSprite(b.sprite, b.x, b.y);
            b.sprite = SPR.bombExplosion;
            b.x -= 2;
            b.y += 2;
            drawSprite(b.sprite, b.x, b.y);
        } else if (b.blowCnt === 0) {
            eraseSprite(b.sprite, b.x, b.y);
        }
    }

    // --- SAUCER ---
    function resetSaucer() {
        saucer = {
            start: false,  // Due to appear
            active: false, // On screen
            hit: false,
            hitTimer: SAUCER_HIT_TICKS,
            x: 9,
            dx: SAUCER_SPEED
        };
    }

    // TimeToSaucer $0913: the countdown only runs once the rack is below round 1's starting
    // height (and, as in the ROM, stops if its bottom-left corner drops off the screen)
    function timeSaucer() {
        if (refY <= RACK_FIRST_Y || refY > 248) return;
        if (tillSaucer === 0) {
            tillSaucer = SAUCER_INTERVAL;
            saucer.start = true;
        }
        tillSaucer--;
    }

    function updateSaucer() {
        if (!saucer.active) {
            saucer.active = true;
            writeSprite(SPR.saucer, saucer.x, SAUCER_Y);
        }
        if (saucer.hit) {
            saucerHitTick();
            return;
        }
        // The sprite's blank edges wipe out its trail
        saucer.x += saucer.dx;
        writeSprite(SPR.saucer, saucer.x, SAUCER_Y);
        if (saucer.x < 8 || saucer.x >= 193) removeSaucer();
    }

    function saucerHitTick() {
        saucer.hitTimer--;
        if (saucer.hitTimer === SAUCER_HIT_TICKS - 1) {
            writeSprite(SPR.saucerExplosion, saucer.x, SAUCER_Y);
            sfx("saucerHit");
        } else if (saucer.hitTimer === 24) {
            const points = saucerPoints();
            addScore(points);
            drawText(String(points).padStart(3, " "), saucer.x, SAUCER_Y);
        } else if (saucer.hitTimer === 0) {
            removeSaucer();
        }
    }

    function saucerPoints() {
        return SAUCER_SCORES[shotCount % SAUCER_SCORES.length];
    }

    function removeSaucer() {
        clearRect(saucer.x, SAUCER_Y, 24, 8);
        resetSaucer();
    }

    // --- ATTRACT MODE ---
    // The screens around the game are scripts that run a frame at a time: each yield waits a frame
    function* wait(frames) {
        for (let i = 0; i < frames; i++) yield;
    }

    // PrintMessageDel $0A93: one letter every 6 frames
    function* typeText(str, x, y) {
        for (const ch of str) {
            drawText(ch, x, y);
            x += 8;
            yield* wait(6);
        }
    }

    // The arcade's attract cycle (from $0AEA), without the alternate cycle's animated jokes
    function* attractScript(fromGameOver) {
        if (fromGameOver) yield* pushScreen();
        while (true) {
            yield* wait(64);
            yield* typeText("PLAY", 96, 64);
            yield* typeText("SPACE  INVADERS", 56, 88);
            yield* wait(64);
            drawText("*SCORE ADVANCE TABLE*", 32, 120);
            writeSprite(SPR.saucerIcon, 64, 136);
            writeSprite(SPR.invaders[2][0], 64, 152);
            writeSprite(SPR.invaders[1][1], 64, 168);
            writeSprite(SPR.invaders[0][0], 64, 184);
            yield* typeText("=? MYSTERY", 80, 136);
            yield* typeText("=30 POINTS", 80, 152);
            yield* typeText("=20 POINTS", 80, 168);
            yield* typeText("=10 POINTS", 80, 184);
            yield* wait(128);
            yield* demo();
            yield* pushScreen();
        }
    }

    // A silent game that plays itself until its cannon is hit and has finished exploding
    function* demo() {
        newRack(RACK_FIRST_Y);
        invadedFlag = false;
        tasksOn = true;
        while (!player.hit && alive.includes(1)) yield;
        shot.status = SHOT_IDLE;
        while (player.hit) yield;
        tasksOn = false;
    }

    // The screen the arcade shows once a coin is in. Here no coin is needed.
    function* pushScreen() {
        clearPlayfield();
        drawText("PUSH", 96, 96);
        drawText("ONLY 1PLAYER  BUTTON", 32, 120);
        yield* wait(128);
        clearPlayfield();
    }

    // PromptPlayer $088D: the score blinks while "PLAY PLAYER<1>" shows
    function* startScript() {
        clearPlayfield();
        drawText("PLAY PLAYER<1>", 56, 112);
        for (let t = 176; t > 0; t--) {
            if (t & 4) clearRect(24, 24, 32, 8);
            else drawScores();
            yield;
        }
        drawScores();
        newRack(RACK_FIRST_Y);
        tasksOn = true;
    }

    function* gameOverScript() {
        yield* typeText("GAME OVER", 72, 56);
        yield* wait(128);
        mode = "attract";
        yield* attractScript(true);
    }

    // --- GAME LOOP ---
    // Game tasks run in the arcade's order: its end-of-screen interrupt, its mid-screen interrupt,
    // then its main loop, which pauses at the end of a round
    function runGameTasks() {
        timeFleetSound();
        drawInvader();
        updatePlayer();
        updatePlayerShot();
        updateBombs();
        timeSaucer();
        advanceCursor();
        if (numAliens === 0 && mode === "playing") {
            endOfRound();
            return;
        }
        playerFire();
        playerShotHit();
        rackBump();
        countInvaders();
        checkExtraShip();
    }

    function step() {
        frame++;
        if (mode === "attract" && (pressed["Enter"] || pressed["Space"])) startGame();
        if (tasksOn) runGameTasks();
        if (script && script.next().done) script = null;
        sound.setSaucer(mode === "playing" && tasksOn && saucer !== null && saucer.active && !saucer.hit);
        for (const k in pressed) delete pressed[k];
    }

    // --- RENDERING ---
    // The colour of each screen pixel under the overlay: red across the saucer's row, green over
    // the shields and cannon, and green under the spare cannons on the bottom row
    const overlay = new Uint32Array(W * H);
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            let colour = OVERLAY_WHITE;
            if (y >= 32 && y <= 62) colour = OVERLAY_RED;
            else if (y >= 184 && y <= 239) colour = OVERLAY_GREEN;
            else if (y >= 240 && x >= 16 && x <= 133) colour = OVERLAY_GREEN;
            overlay[y * W + x] = colour;
        }
    }

    const frameCanvas = document.createElement("canvas");
    frameCanvas.width = W;
    frameCanvas.height = H;
    const frameCtx = frameCanvas.getContext("2d");
    const frameImage = frameCtx.createImageData(W, H);
    const framePixels = new Uint32Array(frameImage.data.buffer);

    // The canvas is a whole-number multiple of the arcade screen so every pixel scales evenly;
    // the browser then fits it to the window
    function resize() {
        const rect = canvas.getBoundingClientRect();
        const scale = Math.max(1, Math.ceil(rect.width * (window.devicePixelRatio || 1) / W));
        canvas.width = W * scale;
        canvas.height = H * scale;
    }

    function render() {
        for (let i = 0; i < screen.length; i++) framePixels[i] = screen[i] ? overlay[i] : OVERLAY_BLACK;
        frameCtx.putImageData(frameImage, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(frameCanvas, 0, 0, canvas.width, canvas.height);
    }

    // Fixed 60 Hz simulation, drawn at whatever rate the display refreshes
    let lastTime = performance.now();
    let lag = 0;

    function loop(now) {
        lag += Math.min(now - lastTime, 250);
        lastTime = now;
        while (lag >= FRAME_MS) {
            step();
            lag -= FRAME_MS;
        }
        render();
        requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resize);
    resize();
    drawHud();
    script = attractScript(false);
    requestAnimationFrame(loop);
</script>
</body>
</html>
